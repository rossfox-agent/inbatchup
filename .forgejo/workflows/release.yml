name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest build twine python-semantic-release

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "Forgejo CI"
          GIT_AUTHOR_EMAIL: "ci@rossfox.xyz"
          GIT_COMMITTER_NAME: "Forgejo CI"
          GIT_COMMITTER_EMAIL: "ci@rossfox.xyz"
        run: |
          git config user.name "Forgejo CI"
          git config user.email "ci@rossfox.xyz"
          semantic-release publish

      - name: Build package
        run: |
          python -m build
          ls -la dist/

      - name: Publish to Forgejo Generic Package Registry
        run: |
          for file in dist/*; do
            filename=$(basename "$file")
            curl -s -X PUT \
              -H "Authorization: token ${{ secrets.FORGEJO_TOKEN }}" \
              --upload-file "$file" \
              "https://git.rossfox.xyz/api/packages/ross/generic/irida-next-batch-uploader/${{ github.ref_name }}/$filename"
            echo "Published $filename"
          done

      - name: Publish to PyPI (optional, requires PYPI_TOKEN secret)
        if: env.PYPI_TOKEN != ''
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload dist/*
          echo "Published to PyPI"