name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y git
          python -m pip install --upgrade pip
          pip install requests pytest build twine python-semantic-release

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Configure git for semantic release
        run: |
          git config user.name "Forgejo CI"
          git config user.email "ci@rossfox.xyz"

      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: "Forgejo CI"
          GIT_AUTHOR_EMAIL: "ci@rossfox.xyz"
          GIT_COMMITTER_NAME: "Forgejo CI"
          GIT_COMMITTER_EMAIL: "ci@rossfox.xyz"
        run: |
          semantic-release publish || echo "No release needed (no new commits since last release)"

      - name: Build package
        run: |
          python -m build
          ls -la dist/

      - name: Publish to Forgejo Generic Package Registry
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          for file in dist/*; do
            filename=$(basename "$file")
            curl -s -X PUT \
              -H "Authorization: token $FORGEJO_TOKEN" \
              --upload-file "$file" \
              "https://git.rossfox.xyz/api/packages/ross/generic/irida-next-batch-uploader/latest/$filename"
            echo "Published $filename"
          done

      - name: Publish to PyPI (optional)
        if: env.PYPI_TOKEN != ''
        env:
          TWINE_USERNAME: "__token__"
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload dist/*
          echo "Published to PyPI"