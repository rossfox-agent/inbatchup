name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container: python:3.12-slim

    steps:
      - name: Checkout
        run: |
          apt-get update && apt-get install -y git
          git clone --depth 1 https://github.com/rossfox-agent/irida-next-batch-uploader.git /workspace
          cd /workspace
          git fetch origin
          git checkout ${{ github.ref_name || 'main' }}
          cp -a /workspace/. .
        shell: bash

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest build
        shell: bash

      - name: Lint (syntax check)
        run: |
          python -m py_compile irida_batch_uploader.py
          echo "Syntax OK"
        shell: bash

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        shell: bash

      - name: Build package
        run: |
          python -m build
          echo "Build OK"
          ls -la dist/
        shell: bash

      - name: Verify built package imports
        run: |
          pip install dist/*.whl
          python -c "import irida_batch_uploader; print('Package import OK')"
          irida-batch-upload --help | head -5
          pip uninstall -y irida-next-batch-uploader
        shell: bash