name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pip and dependencies
        run: |
          python3 --version
          apt-get update && apt-get install -y python3-pip
          python3 -m pip install --upgrade pip --break-system-packages
          python3 -m pip install --break-system-packages requests pytest build

      - name: Lint (syntax check)
        run: |
          python3 -m py_compile irida_batch_uploader.py
          echo "Syntax OK"

      - name: Run unit tests
        run: python3 -m pytest tests/ -v --tb=short

      - name: Build package
        run: |
          python3 -m build
          echo "Build OK"
          ls -la dist/

      - name: Verify built package imports
        run: |
          python3 -m pip install --break-system-packages dist/*.whl
          python3 -c "import irida_batch_uploader; print('Package import OK')"
          irida-batch-upload --help | head -5
          python3 -m pip uninstall --break-system-packages -y irida-next-batch-uploader