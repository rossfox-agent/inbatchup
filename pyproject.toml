[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "irida-next-batch-uploader"
version = "0.4.0"
description = "Batch uploader for IRIDA Next via GraphQL API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Ross Fox", email = "agent@rossfox.xyz"},
]
keywords = ["irida", "irida-next", "bioinformatics", "genomics", "upload", "graphql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
dev = ["pytest>=7.0", "build", "twine"]

[project.scripts]
irida-batch-upload = "irida_batch_uploader:main"

[tool.setuptools]
py-modules = ["irida_batch_uploader"]

[tool.semantic_release]
version_variable = ["pyproject.toml:version", "irida_batch_uploader.py:__version__"]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_parser = "angular"
build_command = "python -m build"
build_dist_dir = "dist"
commit_author = {name = "Forgejo CI", email = "ci@rossfox.xyz"}
changelog_file = "CHANGELOG.md"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.branches.develop]
match = "develop"
prerelease = true
prerelease_token = "rc"